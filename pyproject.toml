[project]
name = "farol"
version = "0.1.0"
description = "Central de carreira local: busca de vagas remotas, pipeline de candidaturas, currículos e roadmap de estudos."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
farol = "farol.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farol*"]

[tool.setuptools.package-data]
farol = ["templates/*.html", "static/*", "data/*.json", "schema.sql"]

[project]
name = "farol-carreira"
dynamic = ["version"]
description = "Central de carreira local: vagas remotas, pipeline de candidaturas, currículos e roadmap de estudos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Zanetti", email = "landradezanetti@gmail.com" }]
keywords = ["vagas", "carreira", "curriculo", "jobs", "resume", "job-search", "ats", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/Bappoz/Tunel"
Repository = "https://github.com/Bappoz/Tunel"
Issues = "https://github.com/Bappoz/Tunel/issues"
Changelog = "https://github.com/Bappoz/Tunel/blob/main/CHANGELOG.md"

[project.scripts]
farol = "farol.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "farol.__version__" }

[tool.setuptools.packages.find]
include = ["farol*"]

[tool.setuptools.package-data]
farol = ["templates/*.html", "static/*", "data/*.json", "schema.sql"]

# ---------------------------------------------------------------- qualidade

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:farol.*",
]

[tool.coverage.run]
source = ["farol"]
omit = ["farol/__main__.py", "farol/launcher.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE entra de propósito: `except Exception` é legítimo nas bordas deste app
# (coleta, IA, leitura de PDF), mas cada ocorrência precisa dizer por escrito por
# que engolir tudo ali é o comportamento certo.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "E501",    # SQL e texto em português quebram mal na marra; a régua é humana aqui
    "RUF001",  # o app é em português: acento e travessão são conteúdo, não erro
    "RUF002",
    "RUF003",
    "B008",    # padrão do FastAPI para dependências
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["farol"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github farol tests

  testes:
    name: testes ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          # a matriz completa em todo sistema não paga; a versão do meio roda no Linux
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest --cov=farol --cov-report=term-missing
      # a suíte não acessa a rede; se algum teste tentar, é defeito do teste
      - name: CLI responde
        run: |
          python -m farol versao
          python -m farol caminho

  pacote:
    name: pacote instalável
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  container:
    name: imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t farol:ci .
      - name: contêiner sobe e responde
        run: |
          docker run -d --name farol-ci -p 7788:7788 farol:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7788/saude | grep -q '"farol"'; then
              echo "servidor de pé"; docker rm -f farol-ci; exit 0
            fi
            sleep 1
          done
          echo "o servidor não respondeu"; docker logs farol-ci; exit 1
